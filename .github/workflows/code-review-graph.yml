name: Code Review Graph

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: code-review-graph-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Dependency Graph & Blast Radius
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run impact analyzer
        id: impact
        run: |
          RESULT=$(python engineering/code-review-graph/scripts/impact_analyzer.py . \
            --base origin/${{ github.base_ref }} --head HEAD --json)
          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          RISK=$(echo "$RESULT" | python -c "import json,sys; print(json.load(sys.stdin)['risk_label'])")
          echo "risk=$RISK" >> "$GITHUB_OUTPUT"

      - name: Run graph builder
        id: graph
        run: |
          GRAPH=$(python engineering/code-review-graph/scripts/graph_builder.py . \
            --base origin/${{ github.base_ref }} --head HEAD)
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$GRAPH" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Run reviewer router
        id: routing
        run: |
          PR_AUTHOR=$(git log -1 --format="%ae" HEAD)
          ROUTING=$(python engineering/code-review-graph/scripts/review_router.py . \
            --base origin/${{ github.base_ref }} --head HEAD --exclude "$PR_AUTHOR")
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ROUTING" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set risk emoji
        id: emoji
        run: |
          case "${{ steps.impact.outputs.risk }}" in
            LOW)      echo "icon=✅" >> "$GITHUB_OUTPUT" ;;
            MEDIUM)   echo "icon=⚠️"  >> "$GITHUB_OUTPUT" ;;
            HIGH)     echo "icon=🔴" >> "$GITHUB_OUTPUT" ;;
            CRITICAL) echo "icon=🚨" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const risk = '${{ steps.impact.outputs.risk }}';
            const icon = '${{ steps.emoji.outputs.icon }}';
            const graph = `${{ steps.graph.outputs.output }}`;
            const routing = `${{ steps.routing.outputs.output }}`;
            const impactRaw = `${{ steps.impact.outputs.result }}`;
            const impactJson = JSON.parse(impactRaw);

            const body = [
              `## ${icon} Code Review Graph — Blast Radius: ${risk}`,
              '',
              `| Metrik | Wert |`,
              `|--------|------|`,
              `| Geänderte Dateien | ${impactJson.changed_count} |`,
              `| Betroffene Dateien | ${impactJson.total_affected_files} |`,
              `| Risikolevel | **${risk}** |`,
              '',
              '### Abhängigkeitsgraph',
              '```',
              graph,
              '```',
              '',
              '### Reviewer-Zuweisung',
              '```',
              routing,
              '```',
              '',
              '<sub>Automatisch generiert von <code>engineering/code-review-graph</code></sub>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.body.includes('Code Review Graph') &&
              c.user.type === 'Bot'
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on CRITICAL blast radius
        if: steps.impact.outputs.risk == 'CRITICAL'
        run: |
          echo "::error::CRITICAL blast radius — Architecture Review vor dem Merge erforderlich"
          exit 1
