<script type="text/babel-app" id="app-source">
const { useState, useMemo, useCallback } = React;
const Recharts = window.Recharts || null;

/* ============================================================
   KONSTANTEN
   ============================================================ */

const SAISON_KEYS = ['winter', 'sommer', 'fruehjahr', 'herbst'];
const SAISON_LABELS = { winter: 'Winter-Hauptsaison', sommer: 'Sommer-Hauptsaison', fruehjahr: 'Nebensaison Frühjahr', herbst: 'Nebensaison Herbst' };
const TAGE_PRO_MONAT = 30.4;

const GROESSE_OPTIONS = [
  { value: '1-Zi', label: '1-Zimmer', range: '8.000–12.000 €', mid: 10000 },
  { value: '2-Zi', label: '2-Zimmer', range: '12.000–18.000 €', mid: 15000 },
  { value: '3-Zi', label: '3-Zimmer', range: '18.000–25.000 €', mid: 21500 },
];

const AMPEL_OPTIONS = [
  { value: 'gruen', label: 'Grün' },
  { value: 'gelb', label: 'Gelb' },
  { value: 'rot', label: 'Rot' },
];

const STANDORT_CRITERIA = [
  { key: 'entfernung', label: 'Entfernung Kempten Zentrum', weight: 10, maxPoints: 10,
    options: [
      { value: 'lt2', label: '< 2 km', points: 10 },
      { value: '2-5', label: '2–5 km', points: 8 },
      { value: '5-10', label: '5–10 km', points: 5 },
      { value: 'gt10', label: '> 10 km', points: 2 },
    ] },
  { key: 'zugpferde', label: 'Nähe Zugpferde (Oberstdorf, Neuschwanstein/Füssen, Alpsee/Immenstadt, Skigebiete)', weight: 20, maxPoints: 10,
    options: [
      { value: 'lt20', label: '< 20 min Fahrzeit', points: 10 },
      { value: '20-40', label: '20–40 min Fahrzeit', points: 7 },
      { value: 'gt40', label: '> 40 min Fahrzeit', points: 3 },
    ] },
  { key: 'aussicht', label: 'Aussicht/Lagequalität', weight: 10, maxPoints: 10,
    options: [
      { value: 'berg', label: 'Bergblick/ruhig', points: 10 },
      { value: 'neutral', label: 'Neutral', points: 6 },
      { value: 'strasse', label: 'Hauptstraße/Gewerbe', points: 2 },
    ] },
  { key: 'parkplatz', label: 'Parkplatz', weight: 15, maxPoints: 10,
    options: [
      { value: 'eigen', label: 'Eigener Stellplatz', points: 10 },
      { value: 'oeffentlich', label: 'Öffentlich verfügbar', points: 6 },
      { value: 'problematisch', label: 'Problematisch', points: 2 },
    ] },
  { key: 'oepnv', label: 'ÖPNV/Bahnhofsnähe', weight: 5, maxPoints: 8,
    options: [
      { value: 'lt1', label: '< 1 km', points: 8 },
      { value: '1-3', label: '1–3 km', points: 5 },
      { value: 'gt3', label: '> 3 km', points: 2 },
    ] },
  { key: 'nahversorgung', label: 'Nahversorgung fußläufig (Bäcker, Supermarkt, Gastro)', weight: 10, maxPoints: 8,
    options: [
      { value: 'ja', label: 'Ja', points: 8 },
      { value: 'teilweise', label: 'Teilweise', points: 5 },
      { value: 'nein', label: 'Nein', points: 2 },
    ] },
  { key: 'konkurrenz', label: 'Konkurrenzdichte (aktive Inserate im Ort/Ortsteil)', weight: 15, maxPoints: 10,
    hint: 'Manuell auf Airbnb/Booking zählen – Momentaufnahme, keine automatische Abfrage.',
    options: [
      { value: 'lt10', label: '< 10 Inserate', points: 10 },
      { value: '10-30', label: '10–30 Inserate', points: 6 },
      { value: 'gt30', label: '> 30 Inserate', points: 3 },
    ] },
  { key: 'ganzjahres', label: 'Ganzjahrestauglichkeit (Winter- UND Sommerattraktion erreichbar)', weight: 15, maxPoints: 10,
    options: [
      { value: 'beides', label: 'Beides erreichbar', points: 10 },
      { value: 'eines', label: 'Nur eines erreichbar', points: 6 },
      { value: 'keines', label: 'Keines', points: 2 },
    ] },
];

const STANDORT_SUGGESTIONS = {
  entfernung: 'Lage weiter vom Zentrum entfernt – auf Alleinstellungsmerkmale (Ruhe, Aussicht, Natur) im Listing setzen.',
  zugpferde: 'Fahrzeit zu den Zugpferden hoch – Transferangebot, E-Bike-Verleih oder Ausflugstipps als Kompensation anbieten.',
  aussicht: 'Lagequalität neutral/schwach – durch Ausstattung, Fotografie und Inneneinrichtung kompensieren.',
  parkplatz: 'Parkplatzsituation verbessern – festen Stellplatz mit dem Eigentümer verhandeln, das hebt den Standort-Score spürbar.',
  oepnv: 'Geringe Bahnhofsnähe – Shuttle- oder Fahrrad-Hinweis im Listing ergänzen.',
  nahversorgung: 'Schwache Nahversorgung – Willkommensmappe mit Lieferdienst- und Einkaufstipps ergänzen.',
  konkurrenz: 'Hohe Konkurrenzdichte – über Ausstattung/Nische differenzieren statt über den Preis zu konkurrieren.',
  ganzjahres: 'Standort nicht ganzjahrestauglich – Nebensaison-Pricing und -Angebote gezielt aggressiver gestalten.',
};

/* ============================================================
   PURE-FUNCTIONS – BERECHNUNGSLOGIK
   ============================================================ */

function evaluateKO(ko) {
  const items = [
    { key: 'untervermietung', label: 'Untervermietungserlaubnis', status: ko.untervermietung },
    { key: 'baurecht', label: 'Baurecht / Nutzungsänderung', status: ko.baurecht },
    { key: 'zweckentfremdung', label: 'Zweckentfremdungssatzung',
      status: ko.zweckentfremdungVorhanden === 'nein' ? 'gruen' : ko.zweckentfremdungGenehmigung },
  ];
  if (ko.wegAnwendbar) items.push({ key: 'weg', label: 'WEG-Zustimmung', status: ko.wegStatus });
  items.push({ key: 'brandschutz', label: 'Brandschutz/Sicherheit', status: ko.brandschutz });

  const hasRot = items.some((i) => i.status === 'rot');
  const hasGelb = items.some((i) => i.status === 'gelb');
  const overall = hasRot ? 'rot' : hasGelb ? 'gelb' : 'gruen';
  const offenePunkte = items.filter((i) => i.status !== 'gruen').map((i) => i.label);
  const rotPunkte = items.filter((i) => i.status === 'rot').map((i) => i.label);
  return { items, overall, offenePunkte, rotPunkte };
}

function computeStandortScore(standort) {
  let score = 0;
  let answered = 0;
  const breakdown = [];
  for (const crit of STANDORT_CRITERIA) {
    const opt = crit.options.find((o) => o.value === standort[crit.key]);
    if (opt) answered += 1;
    const points = opt ? opt.points : 0;
    const contrib = (points / crit.maxPoints) * crit.weight;
    score += contrib;
    breakdown.push({ key: crit.key, label: crit.label, points, maxPoints: crit.maxPoints, weight: crit.weight, contrib, lostContrib: crit.weight - contrib });
  }
  return { score, breakdown, answered, total: STANDORT_CRITERIA.length };
}

function scenarioMultiplier(type) {
  if (type === 'konservativ') return { occ: 0.8, adr: 0.95 };
  if (type === 'optimistisch') return { occ: 1.1, adr: 1.05 };
  return { occ: 1, adr: 1 };
}

function computeScenario(objekt, type) {
  const { occ: occMult, adr: adrMult } = scenarioMultiplier(type);
  let belegteNaechte = 0;
  let bruttoumsatz = 0;
  const totalTage = SAISON_KEYS.reduce((sum, k) => sum + (objekt.saison[k].monate || 0) * TAGE_PRO_MONAT, 0) || 365;

  for (const key of SAISON_KEYS) {
    const s = objekt.saison[key];
    const monate = s.monate || 0;
    let auslastung = ((s.auslastung || 0) / 100) * occMult;
    if (type === 'optimistisch') auslastung = Math.min(auslastung, 0.95);
    auslastung = Math.min(Math.max(auslastung, 0), 1);
    const adr = (s.adr || 0) * adrMult;
    const naechte = monate * TAGE_PRO_MONAT * auslastung;
    belegteNaechte += naechte;
    bruttoumsatz += naechte * adr;
  }

  const v = objekt.variable;
  const turnover = v.aufenthaltsdauer > 0 ? belegteNaechte / v.aufenthaltsdauer : 0;
  const provisionKosten = bruttoumsatz * (v.provision / 100);
  const reinigungKosten = turnover * v.reinigung;
  const verbrauchKosten = turnover * v.verbrauch;
  const kurtaxeKosten = v.kurtaxeDurchgereicht ? 0 : belegteNaechte * v.personenzahl * v.kurtaxeProPersonNacht;
  const instandhaltungKosten = bruttoumsatz * (v.instandhaltungPct / 100);
  const pufferKosten = bruttoumsatz * (v.leerstandPct / 100);
  const variableKosten = provisionKosten + reinigungKosten + verbrauchKosten + kurtaxeKosten + instandhaltungKosten + pufferKosten;

  const f = objekt.fixkosten;
  const monatsFix = f.kaltmiete + f.nebenkosten + f.strom + f.internet + f.versicherung + f.gema + f.software;
  const einmalinvest = (objekt.invest.moeblierung || 0) + (objekt.invest.renovierung || 0);
  const afaJahre = (objekt.invest.afaMonate || 48) / 12;
  const afaJahr = afaJahre > 0 ? einmalinvest / afaJahre : 0;
  const fixkostenJahr = monatsFix * 12 + afaJahr;

  const ergebnisVorSteuern = bruttoumsatz - variableKosten - fixkostenJahr;

  const marginalContribution = bruttoumsatz - variableKosten;
  const avgOccAtS1 = belegteNaechte / totalTage;
  let breakEvenAuslastung = null;
  if (marginalContribution > 0) {
    const sStar = fixkostenJahr / marginalContribution;
    breakEvenAuslastung = sStar * avgOccAtS1 * 100;
  }

  const deckungsbeitragMonat = (bruttoumsatz - variableKosten) / 12;
  const cashflowVorAfaJahr = ergebnisVorSteuern + afaJahr;
  const cashflowVorAfaMonat = cashflowVorAfaJahr / 12;
  const paybackMonate = cashflowVorAfaMonat > 0 ? einmalinvest / cashflowVorAfaMonat : null;
  const umsatzrendite = bruttoumsatz > 0 ? (ergebnisVorSteuern / bruttoumsatz) * 100 : null;

  return {
    type, belegteNaechte, bruttoumsatz, variableKosten, fixkostenJahr, einmalinvest, afaJahr, monatsFix,
    ergebnisVorSteuern, ergebnisMonat: ergebnisVorSteuern / 12,
    breakEvenAuslastung, deckungsbeitragMonat, paybackMonate, umsatzrendite,
    kosten: { provisionKosten, reinigungKosten, verbrauchKosten, kurtaxeKosten, instandhaltungKosten, pufferKosten },
  };
}

function computeSaisonUmsaetze(objekt, type) {
  const { occ: occMult, adr: adrMult } = scenarioMultiplier(type);
  return SAISON_KEYS.map((key) => {
    const s = objekt.saison[key];
    let auslastung = ((s.auslastung || 0) / 100) * occMult;
    if (type === 'optimistisch') auslastung = Math.min(auslastung, 0.95);
    auslastung = Math.min(Math.max(auslastung, 0), 1);
    const adr = (s.adr || 0) * adrMult;
    const naechte = (s.monate || 0) * TAGE_PRO_MONAT * auslastung;
    return { key, saison: SAISON_LABELS[key], umsatz: naechte * adr, naechte };
  });
}

function scoreErgebnis(ergebnisMonat) {
  if (ergebnisMonat > 800) return 40;
  if (ergebnisMonat >= 400) return 30;
  if (ergebnisMonat >= 100) return 18;
  if (ergebnisMonat >= 0) return 8;
  return 0;
}
function scoreBreakEven(be) {
  if (be === null) return 3;
  if (be < 40) return 25;
  if (be <= 50) return 18;
  if (be <= 60) return 10;
  return 3;
}
function scorePayback(months) {
  if (months === null) return 2;
  if (months < 18) return 20;
  if (months <= 30) return 14;
  if (months <= 48) return 7;
  return 2;
}
function scoreKonservativ(konservativErgebnisVorSteuern) {
  return konservativErgebnisVorSteuern > 0 ? 15 : 0;
}
function computeObjektScore(realistisch, konservativ) {
  const ergebnisPts = scoreErgebnis(realistisch.ergebnisMonat);
  const breakEvenPts = scoreBreakEven(realistisch.breakEvenAuslastung);
  const paybackPts = scorePayback(realistisch.paybackMonate);
  const konservativPts = scoreKonservativ(konservativ.ergebnisVorSteuern);
  return { score: ergebnisPts + breakEvenPts + paybackPts + konservativPts,
    breakdown: { ergebnisPts, breakEvenPts, paybackPts, konservativPts } };
}

function computeGesamtscore(standortScore, objektScore) { return 0.4 * standortScore + 0.6 * objektScore; }
function computeAmpelBand(gesamtscore) { return gesamtscore >= 70 ? 'gruen' : gesamtscore >= 50 ? 'gelb' : 'rot'; }
function computeGesamtStatus(koOverall, gesamtscore) {
  if (koOverall === 'rot') return { status: 'nicht_geeignet', band: null };
  const band = computeAmpelBand(gesamtscore);
  return { status: koOverall === 'gelb' ? 'vorbehaltlich' : band, band };
}

function suggestKaltmiete(objekt, realistisch) {
  const delta = objekt.fixkosten.kaltmiete * 0.1;
  const testObjekt = { ...objekt, fixkosten: { ...objekt.fixkosten, kaltmiete: objekt.fixkosten.kaltmiete - delta } };
  const testScenario = computeScenario(testObjekt, 'realistisch');
  return { delta, testScenario };
}

function computeHebel(objekt, standortBreakdown, realistisch, konservativ, objektScoreBreakdown) {
  const items = [];
  for (const b of standortBreakdown) {
    if (b.lostContrib > 0.01) {
      items.push({ source: 'standort', key: b.key, label: b.label, lostGesamt: b.lostContrib * 0.4,
        suggestion: STANDORT_SUGGESTIONS[b.key] || (b.label + ': Punktverlust reduzieren.') });
    }
  }
  const ergebnisLost = 40 - objektScoreBreakdown.ergebnisPts;
  const breakEvenLost = 25 - objektScoreBreakdown.breakEvenPts;
  const paybackLost = 20 - objektScoreBreakdown.paybackPts;
  const konservativLost = 15 - objektScoreBreakdown.konservativPts;

  if (ergebnisLost > 0 || breakEvenLost > 0) {
    const { delta, testScenario } = suggestKaltmiete(objekt, realistisch);
    items.push({ source: 'objekt', key: 'kaltmiete', label: 'Ergebnis / Break-even',
      lostGesamt: Math.max(ergebnisLost, breakEvenLost) * 0.6,
      suggestion: 'Kaltmiete um ' + fmtEUR(delta) + ' (10 %) verhandeln senkt Break-even von ' +
        (realistisch.breakEvenAuslastung == null ? 'n/a' : fmtPct(realistisch.breakEvenAuslastung)) + ' auf ' +
        (testScenario.breakEvenAuslastung == null ? 'n/a' : fmtPct(testScenario.breakEvenAuslastung)) +
        ' und hebt das Monatsergebnis auf ' + fmtEUR(testScenario.ergebnisMonat) + '.' });
  }
  if (paybackLost > 0) {
    items.push({ source: 'objekt', key: 'payback', label: 'Payback Möblierung', lostGesamt: paybackLost * 0.6,
      suggestion: 'Einmalinvest senken (gebrauchte/geleaste Möblierung, Eigenleistung bei der Renovierung) oder mit dem Eigentümer einen Zuschuss zur Einrichtung verhandeln.' });
  }
  if (konservativLost > 0) {
    items.push({ source: 'objekt', key: 'konservativ', label: 'Konservatives Szenario', lostGesamt: konservativLost * 0.6,
      suggestion: 'Konservatives Szenario ist negativ – Auslastungsrisiko zu hoch. Kaltmiete/ADR nachverhandeln oder Objekt meiden.' });
  }
  items.sort((a, b) => b.lostGesamt - a.lostGesamt);
  return items.slice(0, 3);
}

/* ============================================================
   FORMATIERUNG
   ============================================================ */

function fmtEUR(n) {
  const v = Number.isFinite(n) ? n : 0;
  return v.toLocaleString('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
}
function fmtPct(n, d) {
  if (n == null || !Number.isFinite(n)) return '–';
  return n.toLocaleString('de-DE', { minimumFractionDigits: d == null ? 1 : d, maximumFractionDigits: d == null ? 1 : d }) + ' %';
}
function fmtNum(n, d) {
  if (n == null || !Number.isFinite(n)) return '–';
  return n.toLocaleString('de-DE', { minimumFractionDigits: d == null ? 0 : d, maximumFractionDigits: d == null ? 0 : d });
}

/* Zielkorridor für die Umsatzrendite (Marge): 25–40 % */
const MARGE_ZIEL_MIN = 25;
const MARGE_ZIEL_MAX = 40;
function margeBand(pct) {
  if (pct == null || !Number.isFinite(pct)) return null;
  if (pct < MARGE_ZIEL_MIN) return 'niedrig';
  if (pct <= MARGE_ZIEL_MAX) return 'ziel';
  return 'hoch';
}
function margeColor(pct) {
  const band = margeBand(pct);
  if (band === 'ziel') return 'var(--gruen)';
  if (band === 'niedrig') return 'var(--rot)';
  if (band === 'hoch') return 'var(--gelb)';
  return 'inherit';
}
function margeLabel(pct) {
  const band = margeBand(pct);
  if (band === 'ziel') return 'im Zielkorridor (25–40 %)';
  if (band === 'niedrig') return 'unter Zielkorridor (25–40 %)';
  if (band === 'hoch') return 'über Zielkorridor (25–40 %) – Annahmen prüfen';
  return '';
}

function makeId() {
  return (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now();
}

function createObjekt(name) {
  return {
    id: makeId(),
    name: name || 'Neues Objekt',
    adresse: '',
    groesse: '2-Zi',
    uiStep: 0,
    ko: {
      untervermietung: 'gelb',
      baurecht: 'gelb',
      zweckentfremdungVorhanden: 'unklar',
      zweckentfremdungGenehmigung: 'gelb',
      wegAnwendbar: false,
      wegStatus: 'gelb',
      gewerbeanmeldungBestaetigt: false,
      brandschutz: 'gelb',
    },
    standort: { entfernung: '', zugpferde: '', aussicht: '', parkplatz: '', oepnv: '', nahversorgung: '', konkurrenz: '', ganzjahres: '' },
    fixkosten: { kaltmiete: 0, nebenkosten: 0, strom: 0, internet: 0, versicherung: 0, gema: 0, software: 0 },
    invest: { moeblierung: 15000, afaMonate: 48, renovierung: 0, kaution: 0 },
    saison: {
      winter: { monate: 3, adr: 0, auslastung: 0 },
      sommer: { monate: 4, adr: 0, auslastung: 0 },
      fruehjahr: { monate: 2, adr: 0, auslastung: 0 },
      herbst: { monate: 3, adr: 0, auslastung: 0 },
    },
    variable: { provision: 16, reinigung: 0, aufenthaltsdauer: 3, verbrauch: 0, kurtaxeProPersonNacht: 0, personenzahl: 2, kurtaxeDurchgereicht: true, instandhaltungPct: 3, leerstandPct: 5 },
    sensitivity: { kaltmiete: 0, adr: 0, auslastung: 0 },
  };
}

function setPath(obj, path, value) {
  if (path.length === 0) return value;
  const [head, ...rest] = path;
  const base = (obj && typeof obj === 'object') ? obj[head] : undefined;
  return { ...obj, [head]: setPath(base ?? {}, rest, value) };
}

/* Derived analysis for one Objekt (memoized by caller) */
function analyseObjekt(objekt) {
  const ko = evaluateKO(objekt.ko);
  const standort = computeStandortScore(objekt.standort);
  const konservativ = computeScenario(objekt, 'konservativ');
  const realistisch = computeScenario(objekt, 'realistisch');
  const optimistisch = computeScenario(objekt, 'optimistisch');
  const objektScore = computeObjektScore(realistisch, konservativ);
  const gesamtscore = computeGesamtscore(standort.score, objektScore.score);
  const gesamtStatus = computeGesamtStatus(ko.overall, gesamtscore);
  const monateSum = SAISON_KEYS.reduce((s, k) => s + (objekt.saison[k].monate || 0), 0);
  const hebel = gesamtStatus.status === 'gelb' || gesamtStatus.status === 'vorbehaltlich'
    ? computeHebel(objekt, standort.breakdown, realistisch, konservativ, objektScore.breakdown)
    : [];
  return { ko, standort, konservativ, realistisch, optimistisch, objektScore, gesamtscore, gesamtStatus, monateSum, hebel };
}

            <XAxis dataKey="saison" tick={{ fontSize: 11 }} interval={0} angle={-10} textAnchor="end" height={50} />
            <YAxis tick={{ fontSize: 11 }} tickFormatter={(v) => fmtEUR(v)} width={80} />
            <Tooltip formatter={(v) => fmtEUR(v)} />
            <Bar dataKey="umsatz" fill="#1f6f5c" radius={[4, 4, 0, 0]} />
          </BarChart>
        </ResponsiveContainer>
      </div>
    );
  }
  const max = Math.max(1, ...data.map((d) => d.umsatz));
  return (
    <div className="season-bar-fallback">
      {data.map((d) => (
        <div className="bar-col" key={d.key}>
          <div style={{ fontSize: '.72rem' }}>{fmtEUR(d.umsatz)}</div>
          <div className="bar" style={{ height: (d.umsatz / max) * 140 + 'px' }}></div>
          <div className="bar-label">{d.saison}</div>
        </div>
      ))}
    </div>
  );
}

function Sensitivity({ objekt }) {
  const [delta, setDelta] = useState({ kaltmiete: 0, adr: 0, auslastung: 0 });
  const adjusted = useMemo(() => {
    const o = JSON.parse(JSON.stringify(objekt));
    o.fixkosten.kaltmiete = o.fixkosten.kaltmiete * (1 + delta.kaltmiete / 100);
    for (const k of SAISON_KEYS) {
      o.saison[k].adr = o.saison[k].adr * (1 + delta.adr / 100);
      o.saison[k].auslastung = Math.min(100, Math.max(0, o.saison[k].auslastung * (1 + delta.auslastung / 100)));
    }
    return computeScenario(o, 'realistisch');
  }, [objekt, delta]);
  const base = useMemo(() => computeScenario(objekt, 'realistisch'), [objekt]);

  const sliders = [
    { key: 'kaltmiete', label: 'Kaltmiete' },
    { key: 'adr', label: 'ADR' },
    { key: 'auslastung', label: 'Auslastung' },
  ];

  return (
    <div className="card">
      <h3>Pflicht-Sensitivität · „Was wäre wenn“</h3>
      <p className="hint">Alexandras Verhandlungswerkzeug gegenüber Eigentümern – live-Auswirkung auf Ergebnis und Break-even.</p>
      {sliders.map((s) => (
        <div className="slider-row" key={s.key}>
          <label className="field-label" style={{ margin: 0 }}>{s.label} {delta[s.key] > 0 ? '+' : ''}{delta[s.key]}%</label>
          <input type="range" min="-20" max="20" step="1" value={delta[s.key]}
            onChange={(e) => setDelta((d) => ({ ...d, [s.key]: parseInt(e.target.value, 10) }))} />
          <button className="btn small" onClick={() => setDelta((d) => ({ ...d, [s.key]: 0 }))}>Reset</button>
        </div>
      ))}
      <div className="grid cols-2" style={{ marginTop: 12 }}>
        <div className="kpi">
          <div className="label">Ergebnis/Monat (angepasst)</div>
          <div className="value" style={{ color: adjusted.ergebnisMonat >= 0 ? 'var(--gruen)' : 'var(--rot)' }}>{fmtEUR(adjusted.ergebnisMonat)}</div>
          <div className="hint">Basis realistisch: {fmtEUR(base.ergebnisMonat)}</div>
        </div>
        <div className="kpi">
          <div className="label">Break-even (angepasst)</div>
          <div className="value">{adjusted.breakEvenAuslastung == null ? 'nicht erreichbar' : fmtPct(adjusted.breakEvenAuslastung)}</div>
          <div className="hint">Basis realistisch: {base.breakEvenAuslastung == null ? 'nicht erreichbar' : fmtPct(base.breakEvenAuslastung)}</div>
        </div>
      </div>
    </div>
  );
}

function HebelList({ hebel }) {

  return (
    <div className="card">
      <h3>Größte Stellhebel</h3>

    case 'vorbehaltlich': return { text: 'Vorbehaltlich – offene K.O.-Punkte klären', color: 'var(--grau)', bg: '#f1f2f2' };

function Vergleich({ objekte, onSelect }) {
  const [sortKey, setSortKey] = useState('gesamtscore');
  const [sortDir, setSortDir] = useState('desc');

  const rows = objekte.map((o) => {
    const a = analyseObjekt(o);
    return {
      id: o.id, name: o.name, status: a.gesamtStatus.status, gesamtscore: a.gesamtscore,
      ergebnisKons: a.konservativ.ergebnisMonat, ergebnisReal: a.realistisch.ergebnisMonat,
      breakEven: a.realistisch.breakEvenAuslastung, payback: a.realistisch.paybackMonate,
    };
  });

  const sorted = [...rows].sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (va == null) va = -Infinity;
    if (vb == null) vb = -Infinity;
    if (typeof va === 'string') return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    return sortDir === 'asc' ? va - vb : vb - va;
  });

  function toggleSort(key) {
    if (sortKey === key) setSortDir((d) => (d === 'asc' ? 'desc' : 'asc'));
    else { setSortKey(key); setSortDir('desc'); }
  }

  const cols = [
    { key: 'name', label: 'Objekt' }, { key: 'status', label: 'Ampel' }, { key: 'gesamtscore', label: 'Score' },
    { key: 'ergebnisKons', label: 'Ergebnis/Monat konserv.' }, { key: 'ergebnisReal', label: 'Ergebnis/Monat realist.' },
    { key: 'breakEven', label: 'Break-even' }, { key: 'payback', label: 'Payback (Mon.)' },
  ];

  return (
    <div>
      <h2>Objektvergleich</h2>
      {rows.length === 0 ? <div className="empty-state">Noch keine Objekte angelegt.</div> : (
        <div className="card" style={{ overflowX: 'auto' }}>
          <table>
            <thead>
              <tr>{cols.map((c) => <th key={c.key} onClick={() => toggleSort(c.key)}>{c.label}{sortKey === c.key ? (sortDir === 'asc' ? ' ▲' : ' ▼') : ''}</th>)}</tr>
            </thead>
            <tbody>
              {sorted.map((r) => (
                <tr key={r.id} onClick={() => onSelect(r.id)} style={{ cursor: 'pointer' }}>
                  <td><strong>{r.name}</strong></td>
                  <td><AmpelBadge status={r.status} /> {AmpelStatusLabel(r.status).text}</td>
                  <td>{fmtNum(r.gesamtscore, 1)}</td>
                  <td>{fmtEUR(r.ergebnisKons)}</td>
                  <td>{fmtEUR(r.ergebnisReal)}</td>
                  <td>{r.breakEven == null ? 'n/a' : fmtPct(r.breakEven)}</td>
                  <td>{r.payback == null ? '–' : fmtNum(r.payback, 1)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

const STEP_LABELS = ['1 · K.O.-Filter', '2a · Standort', '2b · Kalkulation', '3 · Ergebnis'];

function ProgressBar({ step, setStep, locked }) {
  return (
    <div className="progress no-print">
      {STEP_LABELS.map((label, i) => {
        const isLocked = locked && i > 0;
        return (
          <div key={label} className={'step' + (i === step ? ' active' : i < step ? ' done' : '') + (isLocked ? ' locked' : '')}
            onClick={() => !isLocked && setStep(i)}>{label}</div>
        );
      })}
    </div>
  );
}

function Wizard({ objekt, update, onPrint }) {
  const step = objekt.uiStep || 0;
  const setStep = (s) => update(['uiStep'], s);
  const analysis = useMemo(() => analyseObjekt(objekt), [objekt]);
  const locked = analysis.ko.overall === 'rot';
  const monateSum = analysis.monateSum;

  return (
    <div>
      <ProgressBar step={step} setStep={setStep} locked={locked} />
      {step === 0 && <StepKO objekt={objekt} update={update} />}
      {step === 1 && !locked && <StepStandort objekt={objekt} update={update} />}
      {step === 2 && !locked && <StepKalkulation objekt={objekt} update={update} />}
      {step === 3 && !locked && <StepErgebnis objekt={objekt} analysis={analysis} />}
      {locked && step > 0 && (
        <div className="banner rot">Stufe 2 ist gesperrt, solange ein K.O.-Kriterium rot ist. Bitte zurück zu Stufe 1.</div>
      )}

      <div className="no-print" style={{ display: 'flex', justifyContent: 'space-between', marginTop: 20 }}>
        <button className="btn" disabled={step === 0} onClick={() => setStep(Math.max(0, step - 1))}>← Zurück</button>
        <div style={{ display: 'flex', gap: 8 }}>
          {step === 3 && <button className="btn" onClick={onPrint}>Druckansicht</button>}
          <button className="btn primary" disabled={step === 3 || locked || (step === 2 && monateSum !== 12)}
            onClick={() => setStep(Math.min(3, step + 1))}>
            {step === 2 && monateSum !== 12 ? 'Monate müssen 12 ergeben' : 'Weiter →'}
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [objekte, setObjekte] = useState(() => [createObjekt('Objekt 1')]);
  const [activeId, setActiveId] = useState(() => objekte[0] ? objekte[0].id : null);
  const [view, setView] = useState('wizard');
  const fileInputRef = React.useRef(null);

  const activeObjekt = objekte.find((o) => o.id === activeId) || null;

  const update = useCallback((path, value) => {
    setObjekte((prev) => prev.map((o) => (o.id === activeId ? setPath(o, path, value) : o)));
  }, [activeId]);

  function addObjekt() {
    const o = createObjekt('Objekt ' + (objekte.length + 1));
    setObjekte((prev) => [...prev, o]);
    setActiveId(o.id);
    setView('wizard');
  }

  function removeObjekt(id) {
    setObjekte((prev) => {
      const next = prev.filter((o) => o.id !== id);
      if (activeId === id) setActiveId(next[0] ? next[0].id : null);
      return next;
    });
  }

  function exportJSON() {
    const data = JSON.stringify({ objekte, exportedAt: new Date().toISOString() }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'fewo-potentialrechner-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importJSON(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.objekte)) throw new Error('Ungültiges Format');
        setObjekte(parsed.objekte);
        setActiveId(parsed.objekte[0] ? parsed.objekte[0].id : null);
        setView('wizard');
      } catch (err) {
        alert('Import fehlgeschlagen: Datei ist kein gültiger FeWo-Potentialrechner-Export.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  function handlePrint() {
    window.print();
  }

  const printAnalysis = activeObjekt ? analyseObjekt(activeObjekt) : null;

  return (
    <React.Fragment>
      <header className="app-header no-print">
        <div className="brand">
          <h1>FeWo-Potentialrechner Allgäu</h1>
          <span className="subtitle">Go/No-Go-Bewertung für Rent-to-Rent-Objekte im Raum Kempten</span>
        </div>
        <div className="toolbar">
          <button className="btn" onClick={() => setView('vergleich')}>Objektvergleich</button>
          <button className="btn" onClick={exportJSON}>JSON exportieren</button>
          <button className="btn" onClick={() => fileInputRef.current && fileInputRef.current.click()}>JSON importieren</button>
          <input type="file" accept="application/json" ref={fileInputRef} style={{ display: 'none' }} onChange={importJSON} />
        </div>
      </header>

      <div className="layout no-print">
        <aside className="sidebar no-print">
          {objekte.map((o) => {
            const a = analyseObjekt(o);
            return (
              <div key={o.id} className={'objekt-tab' + (o.id === activeId && view === 'wizard' ? ' active' : '')}
                onClick={() => { setActiveId(o.id); setView('wizard'); }}>
                <span className={'dot ' + (a.gesamtStatus.status === 'nicht_geeignet' ? 'rot' : a.gesamtStatus.status === 'vorbehaltlich' ? 'grau' : a.gesamtStatus.band || 'grau')}></span>
                <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{o.name}</span>
                <button className="btn ghost small" onClick={(e) => { e.stopPropagation(); removeObjekt(o.id); }} title="Objekt löschen">✕</button>
              </div>
            );
          })}
          <button className="btn" style={{ width: '100%', marginTop: 10 }} onClick={addObjekt}>+ Neues Objekt</button>
        </aside>

        <main className="main no-print">
          {view === 'vergleich' && (
            <Vergleich objekte={objekte} onSelect={(id) => { setActiveId(id); setView('wizard'); }} />
          )}
          {view === 'wizard' && activeObjekt && (
            <div>
              <div className="grid cols-2 no-print" style={{ marginBottom: 16 }}>
                <div>
                  <label className="field-label">Objektname</label>
                  <input type="text" value={activeObjekt.name} onChange={(e) => update(['name'], e.target.value)} />
                </div>
                <div>
                  <label className="field-label">Adresse</label>
                  <input type="text" value={activeObjekt.adresse} onChange={(e) => update(['adresse'], e.target.value)} placeholder="Straße, PLZ Ort" />
                </div>
              </div>
              <Wizard objekt={activeObjekt} update={update} onPrint={handlePrint} />
            </div>
          )}
          {view === 'wizard' && !activeObjekt && (

              <p>Noch kein Objekt angelegt.</p>
              <button className="btn primary" onClick={addObjekt}>+ Neues Objekt anlegen</button>
            </div>
          )}
        </main>
      </div>

      <footer className="footer no-print">
        Entscheidungshilfe, ersetzt keine steuerliche/rechtliche Beratung. Rechtliche K.O.-Kriterien sind vor Vertragsschluss schriftlich zu bestätigen.
      </footer>

      {activeObjekt && printAnalysis && <PrintSheet objekt={activeObjekt} analysis={printAnalysis} />}
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
