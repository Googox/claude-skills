# Fallback behaviour when no keyword matches
fallback:
  action: ask_clarifying_question
  question: "Which area does this fall into: content creation, campaign planning, product management, CEO strategy, or CTO technical advisory?"
  options:
    - cs-content-creator
    - cs-demand-gen-specialist
    - cs-product-manager
    - cs-ceo-advisor
    - cs-cto-advisor
